name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test release tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_release*.py'

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint .

  docs:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install just
        run: brew install just

      - name: Build documentation
        run: just build-docs

  example:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install just
        run: brew install just

      - name: Print tool versions
        run: xcodebuild -version

      - name: Build the example app
        run: just build-example CODE_SIGNING_ALLOWED=NO
